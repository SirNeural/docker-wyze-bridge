name: Wyze motion image

on:
  push:
    branches: [feature/wyze-motion-events-v4.5.0]
  pull_request:
    branches: [baseline/wyze-bridge-v4.5.0]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wyze-detections-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
      - run: go test ./...
      - run: go vet ./...
      - run: go test -race ./internal/wyzeapi ./internal/motion ./internal/mqtt ./internal/camera

  image:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=4.5.0-motion
          tags: |
            ${{ steps.image.outputs.name }}:motion-v4.5.0
            ${{ steps.image.outputs.name }}:motion-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=motion
          cache-to: type=gha,scope=motion,mode=max
